name: Copy Trade (poll)

# Loop AUTÔNOMO de copy trading: chama /api/copy/run a cada 5 minutos.
# Funciona no plano Hobby da Vercel (o cron nativo da Vercel só roda 1x/dia no Hobby).
#
# IMPORTANTE:
#  - Workflows agendados só rodam no BRANCH PADRÃO (main) — não disparam em PRs/branches.
#  - O bot só envia ORDENS REAIS quando COPY_LIVE=true nas env vars da Vercel.
#    Com COPY_LIVE=false (padrão) ele roda sozinho mas apenas SIMULA.
#
# Configure em GitHub → Settings → Secrets and variables → Actions:
#   - Secret   CRON_SECRET   = mesmo valor da env CRON_SECRET na Vercel
#   - Variable COPY_RUN_URL  = https://SEU-APP.vercel.app/api/copy/run

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Evita execuções sobrepostas se um ciclo demorar.
concurrency:
  group: copy-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar ciclo de copy trading
        env:
          URL: ${{ vars.COPY_RUN_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Defina a variable COPY_RUN_URL e o secret CRON_SECRET nas configurações do repositório."
            exit 1
          fi
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $SECRET" "$URL")
          echo "HTTP $code"
          # Resumo enxuto (não imprime detalhes de mercados).
          jq -r '{ok, live, runSpend, planned: (.planned|length), executed: (.executed|length)}' /tmp/out.json 2>/dev/null || true
          # Falha o job em erro de servidor para acender o alerta do Actions.
          [ "$code" -lt 500 ] || { echo "::error::Servidor retornou $code"; exit 1; }
